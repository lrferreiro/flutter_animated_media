name: flutter_animated_media
description: Unicode-aware animated emojis, configurable stickers, and searchable media catalogs with lifecycle-aware playback and bounded caching.
version: 0.1.0
homepage: https://pub.dev/packages/flutter_animated_media
repository: https://github.com/lrferreiro/flutter_animated_media
issue_tracker: https://github.com/lrferreiro/flutter_animated_media/issues
topics:
  - emoji
  - animation
  - stickers
  - lottie
  - media

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.1
  crypto: ^3.0.7
  http: ^1.6.0
  lottie: ^3.6.1
  path_provider: ^2.1.6
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/noto/lottie/
    - licenses/CC-BY-4.0.txt
    - licenses/Apache-2.0.txt
    - THIRD_PARTY_NOTICES
