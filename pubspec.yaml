name: flutter_animated_media
description: Unicode-aware animated emojis, configurable stickers, and searchable media catalogs with lifecycle-aware playback and bounded caching.
version: 0.1.0-dev.1
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  animated_emoji: 3.3.0
  characters: ^1.4.1
  crypto: ^3.0.7
  http: ^1.6.0
  lottie: ^3.6.1
  path_provider: ^2.1.6
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - licenses/CC-BY-4.0.txt
    - THIRD_PARTY_NOTICES
